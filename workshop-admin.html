<script>

const PUBLIC_FORM_ORIGIN = "https://www.miaglobo2026.space";
const PUBLIC_FORM_PATHS = {checkin:"/checkin", fase1:"/fase1", fase2:"/fase2"};
const WORKSHOP_CONTROL = "maratona-ia-workshop-control-v1";
const WORKSHOP_RESPONSES = "maratona-ia-workshop-responses-v1";
const WORKSHOP_ROSTER = "maratona-ia-workshop-roster-v1";
const WORKSHOP_API = "/api/workshop";
const WORKSHOP_ADMIN_SESSION = "maratona-ia-workshop-admin-session-v1";
const REMOTE_MODE = !["localhost", "127.0.0.1"].includes(location.hostname) && location.protocol !== "file:";
let ADMIN_TOKEN = sessionStorage.getItem(WORKSHOP_ADMIN_SESSION) || "";
const TOTAL = 80;
const E = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PERSON_NAME = s => String(s ?? "").toLocaleUpperCase("pt-BR");
const pct = (n, b) => b ? Math.round(n / b * 100) : 0;
async function workshopApi(payload){
  const response = await fetch(WORKSHOP_API, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload)});
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || "Não foi possível acessar a base do workshop.");
  return data;
}

// Grafismo
(() => { const g = document.querySelector(".burst g"); const cols = ["#BCFF4D","#8464F3","#D400A8","#B893FD","#0B5A4C"]; let h = "";
  for (let i = 0; i < 36; i++) { const a = i/36*Math.PI*2, r1 = 22, r2 = 52 + (i*37%5)*9, w = .05;
    const p = [[Math.cos(a)*r1,Math.sin(a)*r1],[Math.cos(a-w)*r2,Math.sin(a-w)*r2],[Math.cos(a+w)*r2,Math.sin(a+w)*r2]];
    h += `<polygon fill="${cols[i%5]}" points="${p.map(x=>x.map(v=>v.toFixed(1)).join(",")).join(" ")}"/>`; } g.innerHTML = h; })();

// Estrutura dos formulários (mesma dos formulários publicados)
const FORMS = [
  {key:"checkin", tab:"Check-in", sub:"Perguntas comportamentais", qs:[
    {id:"q1", n:"1", t:"long", s:"Experiência intensa em equipe"}]},
  {key:"fase1", tab:"Fase 1", sub:"Concepção", qs:[
    {id:"q1", n:"1", t:"short", s:"Título provisório"},
    {id:"q3", n:"2", t:"radio", s:"Mascote oficial", o:["Cacatuá roxa","Tartaruga com ventilador nas costas","Ambos os mascotes"]},
    {id:"q2", n:"3", t:"long", s:"Personagem autoral"},
    {id:"q4", n:"4", t:"long", s:"Roteiro do teaser"},
    {id:"q5", n:"5", t:"long", s:"O que o público leva"},
    {id:"q6", n:"6", t:"long", s:"Três cenas-chave"}]},
  {key:"fase2", tab:"Fase 2", sub:"Prototipação", qs:[
    {id:"q1", n:"1", t:"radio", s:"Formato do protótipo", o:["Vídeo de até 30 segundos","Sequência de imagens / storyboard","Slide(s) estático(s) acompanhado de explicação por escrito"]},
    {id:"link", n:"", t:"url", s:"Link do protótipo"},
    {id:"q2", n:"2", t:"check", s:"Ferramentas usadas", o:["ChatGPT","Gemini","Claude","Microsoft Copilot","Midjourney","Adobe Firefly","Runway","Google Veo / Flow","Sora","Kling AI","Pika","CapCut","Canva","ElevenLabs","Adobe Premiere Pro","Outra ferramenta"]},
    {id:"q3", n:"3", t:"long", s:"Como usou cada ferramenta"},
    {id:"q4", n:"4", t:"long", s:"Supervisão humana"},
    {id:"q5", n:"5", t:"check", s:"Limitações", o:["Limite de créditos ou tokens","Limitações da versão gratuita","Tempo insuficiente para concluir a proposta","Erros ou inconsistências geradas pela IA","Dificuldade para manter a consistência visual dos personagens","Dificuldade com prompts ou configurações","Problemas técnicos ou de conexão","Não encontrei limitações relevantes","Outro"]},
    {id:"q6", n:"6", t:"long", s:"Fase 1 x protótipo"},
    {id:"q7", n:"7", t:"long", s:"Assets dos mascotes"},
    {id:"q8", n:"8", t:"long", s:"Próximos passos"}]}
];
const byKey = k => FORMS.find(f => f.key === k);


// Dados de exemplo (gerados de forma fixa para o protótipo)
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(2310);
const pick = a => a[Math.floor(R() * a.length)];
const POOL = ["Texto de exemplo para visualizar como uma resposta aberta aparece no painel.","Aqui entraria o relato da pessoa participante, com as palavras dela.","A resposta real pode ter até 750 caracteres, e o painel mostra o tamanho de cada uma.","Este trecho repete frases fictícias para simular respostas de tamanhos diferentes.","Na versão com dados reais, esta área mostra o texto exatamente como foi enviado."];
const txt = () => { const n = 1 + Math.floor(R() * 5); let s = []; for (let i = 0; i < n; i++) s.push(pick(POOL)); return s.join(" "); };
const hm = (h, m) => `${String(h).padStart(2,"0")}h${String(m).padStart(2,"0")}`;
const P = (Array.isArray(window.WORKSHOP_SELECTED_ROSTER) ? window.WORKSHOP_SELECTED_ROSTER : [])
  .slice(0, TOTAL)
  .map((row, index) => ({
    id:String(row.id || index + 1),
    nome:String(row.nome || ""),
    email:String(row.email || ""),
    r:{},
  }));
const TEST_P = [];
try {

function lev(a, b){ const m = a.length, n = b.length, d = Array.from({length:m+1}, (_, i) => [i]); for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1)); return d[m][n]; }
const guess = em => { let best = null, bd = 99; P.forEach(p => { const d = lev(em, p.email); if (d < bd) { bd = d; best = p; } }); return bd <= 2 ? best : null; };

// Estatísticas por formulário
function tally(k, q){ const rs = P.filter(p => p.r[k]).map(p => p.r[k]); const base = rs.length;
  const rows = q.o.map(o => ({o, n: rs.filter(r => q.t === "check" ? (r[q.id] || []).includes(o) : r[q.id] === o).length}));
  if (q.t === "check") rows.sort((a, b) => b.n - a.n);
  return {base, rows, answered: q.t === "check" ? rs.filter(r => (r[q.id] || []).length).length : base}; }
function hbars(rows, base){ const max = Math.max(...rows.map(r => r.n), 1);
  return `<div class="hb">${rows.map(r => `<div><span class="l">${E(r.o)}</span><span class="t"><i style="width:${r.n / max * 100}%"></i></span><span class="v">${r.n} <small>(${pct(r.n, base)}%)</small></span></div>`).join("")}</div>`; }
function sizeTable(F){
  const opens = F.qs.filter(q => q.t === "long" || q.t === "short"); const rs = P.filter(p => p.r[F.key]).map(p => p.r[F.key]); const base = rs.length;
  return `<div class="tbl"><table class="sz"><colgroup><col class="c-q"><col class="c-n"><col class="c-n"><col class="c-n"><col class="c-n"></colgroup>
  <thead><tr><th>Pergunta</th><th class="n">Responderam</th><th class="n">Média de caracteres</th><th class="n">Até 200 caracteres</th><th class="n">A partir de 675</th></tr></thead><tbody>
  ${opens.map(q => { const lim = q.t === "short" ? 100 : 750; const ls = rs.map(r => (r[q.id] || "").length).filter(Boolean); const avg = ls.length ? Math.round(ls.reduce((a,b)=>a+b,0)/ls.length) : 0;
    const short = ls.filter(l => l <= 200).length, near = ls.filter(l => l >= lim * .9).length;
    return `<tr><td><b>${E(q.n)}.</b> ${E(q.s)}${q.t === "short" ? ` <span class="note">(limite de 100)</span>` : ""}</td><td class="n">${ls.length} <small>(${pct(ls.length, base)}%)</small></td><td class="n">${avg}</td><td class="n">${q.t === "short" ? `<small>não se aplica</small>` : `${short} <small>(${pct(short, ls.length)}%)</small>`}</td><td class="n">${q.t === "short" ? `<small>não se aplica</small>` : `${near} <small>(${pct(near, ls.length)}%)</small>`}</td></tr>`; }).join("")}
  </tbody></table></div>`;
}
function formatDuration(seconds){ const s=Number(seconds); if(!Number.isFinite(s)||s<1)return ""; const m=Math.floor(s/60), r=Math.round(s%60); return m ? `${m} min ${String(r).padStart(2,"0")} s` : `${r} s`; }
function durationStats(rs){ const values=rs.map(r=>Number(r._meta?.duration_seconds)).filter(v=>Number.isFinite(v)&&v>0).sort((a,b)=>a-b); if(!values.length)return null; const avg=Math.round(values.reduce((a,b)=>a+b,0)/values.length), mid=Math.floor(values.length/2), median=values.length%2?values[mid]:Math.round((values[mid-1]+values[mid])/2); return {n:values.length,avg,median,min:values[0],max:values[values.length-1]}; }
function vEstat(){
  const F = byKey(ST.sform); const n = count(F.key); const t = times(F.key); const rs = P.filter(p => p.r[F.key]).map(p => p.r[F.key]);
  const duration = durationStats(rs);
  let extra;
  if (F.key === "checkin") { const all = rs.map(r => r.q1).filter(Boolean).map(s => s.length); const avg = all.length ? Math.round(all.reduce((a,b)=>a+b,0)/all.length) : 0;
    extra = `<div><span class="v">${avg}</span><span class="c">caracteres em média por resposta, num limite de 750</span></div>`; }
  else if (F.key === "fase1") { const tt = rs.filter(r => (r.q1 || "").trim()).length;
    extra = `<div><span class="v">${tt}<small>(${pct(tt, n)}%)</small></span><span class="c">dos ${n} envios trazem título provisório, que é opcional</span></div>`; }
  else { const k = rs.map(r => r.q2.length); const avg = k.length ? (k.reduce((a,b)=>a+b,0)/k.length).toFixed(1).replace(".", ",") : "0";
    extra = `<div><span class="v">${avg}</span><span class="c">ferramentas marcadas em média por pessoa na pergunta 2</span></div>`; }
  const closed = F.qs.filter(q => q.t === "radio" || q.t === "check");
  let html = `<section><h2>Estatísticas por formulário</h2>${subTabs(F.key, "data-sform")}</section>
  <section><h3>Destaques de ${E(F.tab)}</h3><div class="hl">
    <div><span class="v">${n}<small>(${pct(n,TOTAL)}%)</small></span><span class="c">dos 80 participantes enviaram ${E(F.tab)}</span></div>
    <div><span class="v">${TOTAL - n}<small>(${pct(TOTAL - n,TOTAL)}%)</small></span><span class="c">ainda não enviaram</span></div>
    <div><span class="v num">${E(t[0] || "")}</span><span class="c">primeiro envio, e o último foi às ${E(t[t.length-1] || "")}</span></div>
    ${extra}</div></section>`;
  html += `<section><h3>Tempo de preenchimento</h3>${duration ? `<p class="cap">Tempo ativo entre a abertura do formulário e o envio, sem contar períodos em que a página ficou em segundo plano.</p><div class="hl"><div><span class="v">${E(formatDuration(duration.avg))}</span><span class="c">tempo médio</span></div><div><span class="v">${E(formatDuration(duration.median))}</span><span class="c">mediana</span></div><div><span class="v">${E(formatDuration(duration.min))}</span><span class="c">menor tempo</span></div><div><span class="v">${E(formatDuration(duration.max))}</span><span class="c">maior tempo · ${duration.n} envios medidos</span></div></div>` : `<p class="note">A duração começará a aparecer nos próximos envios desta etapa.</p>`}</section>`;
  if (closed.length) html += `<section><h3>Perguntas de escolha</h3><div class="qgrid">${closed.map(q => { const tl = tally(F.key, q);
    return `<div class="qb"><span class="qn">Pergunta ${E(q.n)}</span><h3>${E(q.s)}</h3><p class="cap">${q.t === "check" ? `Cada pessoa pode marcar mais de uma opção, então as porcentagens, calculadas sobre os ${tl.base} envios, não somam 100%.${q.id === "q5" ? ` A pergunta é opcional e ${tl.answered} pessoas (${pct(tl.answered, tl.base)}%) marcaram ao menos uma opção.` : ""}` : `Uma opção por pessoa, sobre os ${tl.base} envios.`}</p>${hbars(tl.rows, tl.base)}</div>`; }).join("")}</div></section>`;
  html += `<section><h3>Tamanho das respostas abertas</h3><p class="cap">Para cada pergunta aberta, quantas pessoas responderam e o tamanho das respostas. Respostas de até 200 caracteres costumam ser curtas demais para a banca avaliar, e as de 675 caracteres ou mais chegaram perto do limite de 750.</p>${sizeTable(F)}</section>`;
  if (F.key === "fase2") {
    const masc = byKey("fase1").qs[2].o, fmts = byKey("fase2").qs[0].o, shortF = ["Vídeo até 30 s","Storyboard","Slides com explicação"];
    const both = P.filter(p => p.r.fase1 && p.r.fase2);
    const cross = masc.map(m => fmts.map(f => both.filter(p => p.r.fase1.q3 === m && p.r.fase2.q1 === f).length)); const cmax = Math.max(...cross.flat(), 1);
    html += `<section><h3>Mascote escolhido na Fase 1 e formato do protótipo</h3><p class="cap">Cruzamento para as ${both.length} pessoas que enviaram a Fase 1 e a Fase 2.</p>
    <div class="tbl"><table class="cross"><thead><tr><th>Mascote na Fase 1</th>${shortF.map(f => `<th>${E(f)}</th>`).join("")}<th>Total</th></tr></thead><tbody>
    ${masc.map((m, i) => `<tr><td>${E(m)}</td>${cross[i].map(v => `<td><span class="cell" style="background:color-mix(in srgb, var(--key) ${Math.round(v / cmax * 55)}%, transparent)">${v}</span></td>`).join("")}<td><b class="num">${cross[i].reduce((a,b)=>a+b,0)}</b></td></tr>`).join("")}
    </tbody></table></div></section>`;
  }
  return html;
}

let pendingOpenChange = null;
function openModal(html, narrow){ lastFocus = document.activeElement; document.getElementById("modalRoot").innerHTML = `<div class="scrim" data-close="1"><div class="modal ${narrow?"narrow":""}" role="dialog" aria-modal="true" aria-labelledby="mt">${html}</div></div>`; const first = document.querySelector(".modal input, .modal button"); if (first) first.focus(); }
function closeModal(){ pendingOpenChange = null; document.getElementById("modalRoot").innerHTML = ""; if (lastFocus && lastFocus.focus) lastFocus.focus(); }
function requestAdminLogin(message=""){
  openModal(`<div class="mh"><div><span class="note">ÁREA ADMINISTRATIVA</span><h2 id="mt">Acessar o painel</h2></div></div>
    <p class="cap">Digite a senha administrativa para carregar participantes, respostas e controles do workshop.</p>
    ${message ? `<p class="confirm-error">${E(message)}</p>` : ""}
    <label class="confirm-field" for="adminPassword">Senha administrativa<input id="adminPassword" type="password" autocomplete="current-password"></label>
    <div class="row"><button class="btn" type="button" data-act="admin-login">Entrar</button><a class="btn ghost" href="avaliacao.html">Voltar ao sistema</a></div>`, true);
  const input = document.getElementById("adminPassword");
  input.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); confirmAdminLogin(); } });
}
async function confirmAdminLogin(){
  const input = document.getElementById("adminPassword");
  const button = document.querySelector('[data-act="admin-login"]');
  if (!input || !input.value) { if (input) input.focus(); return; }
  if (button) { button.disabled = true; button.textContent = "Entrando…"; }
  try {
    const data = await workshopApi({action:"admin-login", adminKey:input.value});
    ADMIN_TOKEN = data.adminToken || "";
    if (!ADMIN_TOKEN) throw new Error("Não foi possível iniciar a sessão administrativa.");
    sessionStorage.setItem(WORKSHOP_ADMIN_SESSION, ADMIN_TOKEN);
    closeModal();
    await loadRemoteStatus();
  } catch (e) {
    if (button) { button.disabled = false; button.textContent = "Entrar"; }
    input.value = "";
    input.focus();
    const old = document.querySelector(".modal .confirm-error");
    if (old) old.textContent = e.message;
    else input.insertAdjacentHTML("beforebegin", `<p class="confirm-error">${E(e.message)}</p>`);
  }
}
function requestOpenChange(k, next){
  const F = byKey(k);
  pendingOpenChange = {k, next};
  const action = next ? "Liberar" : "Fechar";
  const impact = next
    ? `Ao liberar ${F.tab}, ela ficará disponível imediatamente e qualquer outra etapa aberta será fechada.`
    : `Ao fechar ${F.tab}, ela deixará de ficar disponível imediatamente para os participantes.`;
  openModal(`<div class="mh"><div><span class="note">CONFIRMAÇÃO ADMINISTRATIVA</span><h2 id="mt">${action} ${E(F.tab)}?</h2></div></div>
    <div class="confirm-impact">${E(impact)}</div>
    <label class="confirm-field" for="stagePassword">Digite a senha para confirmar<input id="stagePassword" type="password" autocomplete="off" aria-describedby="stagePasswordError"></label>
    <p class="confirm-error" id="stagePasswordError" hidden>Senha incorreta. A etapa não foi alterada.</p>
    <div class="row"><button class="btn" type="button" data-act="confirm-stage-change">Confirmar mudança</button><button class="btn ghost" type="button" data-close="1">Cancelar</button></div>`, true);
  const input = document.getElementById("stagePassword");
  input.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); confirmOpenChange(); } });
}
async function confirmOpenChange(){
  if (!pendingOpenChange) return;
  const input = document.getElementById("stagePassword");
  const error = document.getElementById("stagePasswordError");
  if (!input || !input.value) {
    if (error) error.hidden = false;
    if (input) { input.value = ""; input.focus(); }
    return;
  }
  const change = pendingOpenChange;
  const confirmButton = document.querySelector('[data-act="confirm-stage-change"]');
  if (confirmButton) { confirmButton.disabled = true; confirmButton.textContent = "Salvando…"; }
  try {
    if (REMOTE_MODE) {
      const auth = await workshopApi({action:"admin-login", adminKey:input.value});
      ADMIN_TOKEN = auth.adminToken || "";
      sessionStorage.setItem(WORKSHOP_ADMIN_SESSION, ADMIN_TOKEN);
      await workshopApi({action:"set-activity", adminToken:ADMIN_TOKEN, activity:change.next ? change.k : "fechada"});
    }
  } catch (e) {
    if (error) { error.hidden = false; error.textContent = e.message; }
    if (input) { input.value = ""; input.focus(); }
    if (confirmButton) { confirmButton.disabled = false; confirmButton.textContent = "Confirmar mudança"; }
    return;
  }
  if (change.next) FORMS.forEach(f => ST.open[f.key] = f.key === change.k);
  else ST.open[change.k] = false;
  const label = byKey(change.k).tab;
  pendingOpenChange = null;
  closeModal();
  render();
  toast(change.next ? `${label} liberada para a turma` : `${label} fechada`);
}

function render(){
  renderTabs();
  document.getElementById("view").innerHTML = ({controle:vControle, pessoas:vPessoas, respostas:vRespostas, estatisticas:vEstat}[ST.view] || vControle)(); save();
}

function applyRemoteStatus(data){
  const people = Array.isArray(data.participantsList) ? data.participantsList : [];
  if (people.length) {
    P.splice(0, P.length, ...people.map((row, index) => ({
      id:String(row.id || row.inscricao_id_externo || index + 1),
      nome:String(row.nome || ""),
      email:String(row.email || ""),
      r:{},
    })));
  } else P.forEach(p => p.r = {});
  TEST_P.splice(0, TEST_P.length, ...(Array.isArray(data.testParticipantsList) ? data.testParticipantsList : []).map((row,index)=>({id:String(row.id||row.inscricao_id_externo||`test-${index}`),nome:String(row.nome||""),email:String(row.email||""),isTest:true,r:{}})));
  const active = data.activity;
  FORMS.forEach(f => ST.open[f.key] = f.key === active);
  (Array.isArray(data.responses) ? data.responses : []).forEach(row => {
    const linked = Array.isArray(row.workshop_participantes) ? row.workshop_participantes[0] : row.workshop_participantes;
    const p = P.find(item => item.id === String(linked?.id || "")) || P.find(item => item.email === String(linked?.email || ""));
    if (!p || !row.atividade) return;
    const sent = new Date(row.enviado_at);
    const at = Number.isNaN(sent.getTime()) ? "Agora" : sent.toLocaleDateString("pt-BR") + " " + sent.toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"});
    p.r[row.atividade] = Object.assign({at}, row.respostas || {});
  });
  (Array.isArray(data.testResponses) ? data.testResponses : []).forEach(row => {
    const linked = Array.isArray(row.workshop_participantes) ? row.workshop_participantes[0] : row.workshop_participantes;
    const p = TEST_P.find(item => item.id === String(linked?.id || "")) || TEST_P.find(item => item.email === String(linked?.email || ""));
    if (!p || !row.atividade) return;
    const sent = new Date(row.enviado_at);
    const at = Number.isNaN(sent.getTime()) ? "Agora" : sent.toLocaleDateString("pt-BR") + " " + sent.toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"});
    p.r[row.atividade] = Object.assign({at}, row.respostas || {});
  });
}

async function loadRemoteStatus(){
  const notice = document.getElementById("liveNotice");
  if (!REMOTE_MODE) {
    if (notice) notice.innerHTML = "<b>Ambiente local de teste.</b> Os dados deste navegador não alteram a base publicada.";
    return;
  }
  if (!ADMIN_TOKEN) {
    if (notice) notice.innerHTML = "<b>Painel protegido.</b> Informe a senha administrativa para carregar os dados do workshop.";
    requestAdminLogin();
    return;
  }
  try {
    const data = await workshopApi({action:"admin-status", adminToken:ADMIN_TOKEN});
    applyRemoteStatus(data);
    if (notice) notice.innerHTML = "<b>Conectado à base do sistema.</b> Participantes, liberações e respostas estão sincronizados com o Supabase.";
    render();
  } catch (e) {
    ADMIN_TOKEN = "";
    sessionStorage.removeItem(WORKSHOP_ADMIN_SESSION);
    if (notice) notice.innerHTML = "<b>Painel protegido.</b> A sessão administrativa expirou.";
    requestAdminLogin(e.message);
  }
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-view],[data-copy],[data-act],[data-filter],[data-filter-go],[data-person],[data-rform],[data-sform],[data-cell],[data-close]");
  if (!t) return;
  if (t.dataset.close) { if (t.classList.contains("scrim") && e.target !== t) return; closeModal(); return; }
  if (t.dataset.view) { ST.view = t.dataset.view; render(); window.scrollTo({top:0}); }
  else if (t.dataset.copy) copy(linkOf(t.dataset.copy), `Link de ${byKey(t.dataset.copy).tab} copiado`, document.getElementById("lk-" + t.dataset.copy));
  else if (t.dataset.act === "admin-login") confirmAdminLogin();
  else if (t.dataset.act === "confirm-stage-change") confirmOpenChange();
  else if (t.dataset.act === "csv") exportCsv();
  else if (t.dataset.filter) { ST.filter = t.dataset.filter; render(); }
  else if (t.dataset.filterGo) { ST.view = "pessoas"; ST.filter = t.dataset.filterGo; ST.q = ""; render(); window.scrollTo({top:0}); }
  else if (t.dataset.person) person(t.dataset.person);
  else if (t.dataset.rform) { ST.rform = t.dataset.rform; render(); }
  else if (t.dataset.sform) { ST.sform = t.dataset.sform; render(); }
  else if (t.dataset.cell) { const [pid, qid] = t.dataset.cell.split("|"); cellModal(pid, qid); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && document.querySelector(".scrim")) closeModal();
  if (e.key === "Enter" && e.target.dataset && e.target.dataset.person) person(e.target.dataset.person);
});
document.addEventListener("change", e => {
  if (e.target.dataset.open) { const k = e.target.dataset.open; const next = e.target.checked; e.target.checked = !!ST.open[k]; requestOpenChange(k, next); }
});
document.addEventListener("input", e => {
  if (e.target.id === "search") { ST.q = e.target.value; const rows = pessoasRows(); document.getElementById("pbody").innerHTML = pessoasBody(rows); document.getElementById("pcount").textContent = `Mostrando ${rows.length} de ${TOTAL} participantes.`; save(); }
  if (e.target.id === "rsearch") { ST.rsearch = e.target.value; const F = byKey(ST.rform), rows = respRows(); document.getElementById("rbody").innerHTML = respBody(F, rows); document.getElementById("rcount").textContent = `${rows.length} de ${count(F.key)} envios de ${F.tab}`; save(); }
});
render();
loadRemoteStatus();
</script>

</body></html>
